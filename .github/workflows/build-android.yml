name: Build Formatica Android APK

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      split_per_abi:
        description: 'Split APK per ABI (recommended)'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'formatica_mobile/**'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formatica_mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true
        working-directory: formatica_mobile

      # Note: Flutter tests are optional for APK build - we focus on successful compilation

      - name: Build APK (Release - Split per ABI)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.split_per_abi == 'true'
        run: |
          echo "Building release APK with split per ABI..."
          flutter build apk --release --split-per-abi --verbose
        env:
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"

      - name: Build APK (Release - Universal)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.split_per_abi != 'true'
        run: |
          echo "Building universal release APK..."
          flutter build apk --release --verbose
        env:
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"

      - name: Build APK (Debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          echo "Building debug APK..."
          flutter build apk --debug --verbose
        env:
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK artifacts (Split ABI)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.split_per_abi == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Formatica-Android-Release-APKs
          path: |
            formatica_mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            formatica_mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            formatica_mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK artifact (Universal Release)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.split_per_abi != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Formatica-Android-Universal-Release
          path: formatica_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK artifact (Debug)
        if: github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: Formatica-Android-Debug
          path: formatica_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            formatica_mobile/build/app/outputs/flutter-apk/app-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ github.event.inputs.build_type || 'release' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Split per ABI:** ${{ github.event.inputs.split_per_abi || 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated APKs:" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null | awk '{print "- `" $9 "` (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "No APKs found" >> $GITHUB_STEP_SUMMARY
